name: diag
on: workflow_dispatch
jobs:
  net:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://now.bangkok.go.th/flood-alert.html https://www.bangkok.go.th/ https://publicapi.traffy.in.th/share/teamchadchart/search?limit=5; do
            echo "== $u"; curl -sS -o /dev/null -m 40 -w "%{http_code} %{time_total}s ip=%{remote_ip}\n" -A 'Mozilla/5.0' "$u" || true
          done
          getent hosts now.bangkok.go.th || true
