# Every 30 min: collect evidence (Traffy, Bluesky, news, ThaiWater), publish it with the latest model output
# as release asset live/live.tar.gz and trigger a Vercel rebuild (Deploy Hook).
name: evidence
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
concurrency: {group: live-data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prepared data (gazetteer, named places)
        run: gh release download data-v1 -p prepared-data.tar.gz -O - | tar xz data
      - name: Previous live data
        run: gh release download live -p live.tar.gz -O - | tar xz || echo "no live release yet"
      - name: Thai relay data (sources reachable only from Thailand)
        run: gh release download live -p thai.json.gz -D data/evidence --clobber || echo "no relay data yet"
      - name: News outlets' social posts (flood-social-feed)
        run: gh release download live -p social-feed.json.gz -D data/evidence --clobber || echo "no social feed yet"
      - run: node jobs.mjs evidence
        env: {GISTDA_API_KEY: '${{ secrets.GISTDA_API_KEY }}'}
      - run: scripts/publish-live.sh
        env: {VERCEL_DEPLOY_HOOK: '${{ secrets.VERCEL_DEPLOY_HOOK }}'}
