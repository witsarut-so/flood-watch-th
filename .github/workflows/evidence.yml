# Every 30 min: collect evidence (Traffy, Bluesky, news, ThaiWater), then deploy the static site to Vercel
# together with the latest model output restored from the Actions cache.
name: evidence
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
concurrency: {group: evidence, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Prepared data (release asset)
        run: gh release download data-v1 -p prepared-data.tar.gz -O - | tar xz
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/cache/restore@v4
        with: {path: public/live/model, key: model-none, restore-keys: model-}
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/live/evidence.json
            public/live/waterlevels.json
            data/evidence
          key: evidence-none
          restore-keys: evidence-
      - run: node jobs.mjs evidence
      - uses: actions/cache/save@v4
        with:
          path: |
            public/live/evidence.json
            public/live/waterlevels.json
            data/evidence
          key: evidence-${{ github.run_id }}
      - run: node scripts/build-vercel.mjs
      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
          VERCEL_ORG_ID: '${{ secrets.VERCEL_ORG_ID }}'
          VERCEL_PROJECT_ID: '${{ secrets.VERCEL_PROJECT_ID }}'
