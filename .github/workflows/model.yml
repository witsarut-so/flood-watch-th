# Every 2 hours: run the flood model for all domains (validated against the latest evidence), then deploy.
name: model
on:
  schedule: [{cron: '10 */2 * * *'}]
  workflow_dispatch:
concurrency: {group: model, cancel-in-progress: false}
permissions: {contents: read}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: requirements-model.txt}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-model.txt
      - name: Prepared data (release asset)
        run: gh release download data-v1 -p prepared-data.tar.gz -O - | tar xz
        env: {GH_TOKEN: '${{ github.token }}'}
      - uses: actions/cache/restore@v4
        with:
          path: |
            public/live/evidence.json
            public/live/waterlevels.json
            data/evidence
          key: evidence-none
          restore-keys: evidence-
      - uses: actions/cache/restore@v4
        with: {path: numba-cache, key: numba-${{ hashFiles('model/solver.py') }}, restore-keys: numba-${{ hashFiles('model/solver.py') }}-}
      - run: node jobs.mjs model --force
        env: {NUMBA_CACHE_DIR: numba-cache}
      - uses: actions/cache/save@v4
        with: {path: public/live/model, key: model-${{ github.run_id }}}
      - uses: actions/cache/save@v4
        if: always()
        with: {path: numba-cache, key: numba-${{ hashFiles('model/solver.py') }}-${{ github.run_id }}}
      - run: node scripts/build-vercel.mjs
      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: '${{ secrets.VERCEL_TOKEN }}'
          VERCEL_ORG_ID: '${{ secrets.VERCEL_ORG_ID }}'
          VERCEL_PROJECT_ID: '${{ secrets.VERCEL_PROJECT_ID }}'
